name: Seddly
options:
  bundleIdPrefix: com.pearsonmedia
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  xcodeVersion: "26.3"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top

configFiles:
  Debug: Seddly/Config/Debug.xcconfig
  Release: Seddly/Config/Release.xcconfig

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
    SWIFT_EMIT_LOC_STRINGS: "YES"
    SWIFT_STRICT_CONCURRENCY: complete

targets:
  Seddly:
    type: application
    platform: iOS
    sources:
      - path: Seddly/Sources
        excludes:
          - "**/.gitkeep"
    resources:
      - path: Seddly/Resources
        excludes:
          - "**/.gitkeep"
    settings:
      base:
        INFOPLIST_FILE: Seddly/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Seddly/Resources/Seddly.entitlements
        INFOPLIST_KEY_CFBundleDisplayName: Seddly
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        PRODUCT_BUNDLE_IDENTIFIER: com.pearsonmedia.Seddly
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug:
          CODE_SIGN_STYLE: Automatic
          # US-176: resolved into aps-environment in Seddly.entitlements.
          # A Release build must declare "production" or App Store pushes —
          # including the Pro+ silent-push sync — are delivered to nothing.
          APS_ENVIRONMENT: development
        Release:
          CODE_SIGN_STYLE: Manual
          APS_ENVIRONMENT: production
    dependencies:
      - target: SeddlyShareExtension
      - target: SeddlyWidget
      - target: SeddlyWatch
    scheme:
      testTargets:
        - SeddlyTests
        - SeddlyUITests
      gatherCoverageData: true
      storeKitConfiguration: Seddly/Resources/Seddly.storekit

  SeddlyShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: SeddlyShareExtension
        excludes:
          - "**/.gitkeep"
      - path: Seddly/Sources/Shared
      - path: Seddly/Sources/Models
      - path: Seddly/Sources/Services/RuleFilterService.swift
    settings:
      base:
        INFOPLIST_FILE: SeddlyShareExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: SeddlyShareExtension/SeddlyShareExtension.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.pearsonmedia.Seddly.ShareExtension
      configs:
        Debug:
          CODE_SIGN_STYLE: Automatic
        Release:
          CODE_SIGN_STYLE: Manual

  SeddlyWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: SeddlyWidget
        excludes:
          - "**/.gitkeep"
      - path: Seddly/Sources/Shared
      - path: Seddly/Sources/Models
    settings:
      base:
        INFOPLIST_FILE: SeddlyWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: SeddlyWidget/SeddlyWidget.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.pearsonmedia.Seddly.Widget
      configs:
        Debug:
          CODE_SIGN_STYLE: Automatic
        Release:
          CODE_SIGN_STYLE: Manual

  SeddlyWatch:
    type: application
    platform: watchOS
    sources:
      - path: SeddlyWatch
        excludes:
          - "**/.gitkeep"
      - path: Seddly/Sources/Shared
      - path: Seddly/Sources/Models
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pearsonmedia.Seddly.watchkitapp
        INFOPLIST_FILE: SeddlyWatch/Info.plist
        CODE_SIGN_ENTITLEMENTS: SeddlyWatch/SeddlyWatch.entitlements
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.pearsonmedia.Seddly
        INFOPLIST_KEY_CFBundleDisplayName: Seddly
        TARGETED_DEVICE_FAMILY: "4"
      configs:
        Debug:
          CODE_SIGN_STYLE: Automatic
        Release:
          CODE_SIGN_STYLE: Manual
    dependencies:
      - target: SeddlyWatchComplication
    scheme:
      gatherCoverageData: false

  # US-171: the complication used to live inside the SeddlyWatch app target with
  # no @main WidgetBundle. WidgetKit only discovers widgets vended by a widget
  # extension's principal bundle, so it compiled but could never be added to a
  # watch face. It now has its own extension target, embedded in the watch app.
  SeddlyWatchComplication:
    type: app-extension
    platform: watchOS
    sources:
      - path: SeddlyWatchComplication
        excludes:
          - "**/.gitkeep"
      - path: Seddly/Sources/Shared
      - path: Seddly/Sources/Models
    settings:
      base:
        INFOPLIST_FILE: SeddlyWatchComplication/Info.plist
        CODE_SIGN_ENTITLEMENTS: SeddlyWatchComplication/SeddlyWatchComplication.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.pearsonmedia.Seddly.watchkitapp.complication
        TARGETED_DEVICE_FAMILY: "4"
      configs:
        Debug:
          CODE_SIGN_STYLE: Automatic
        Release:
          CODE_SIGN_STYLE: Manual

  SeddlyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SeddlyTests
        excludes:
          - "**/.gitkeep"
    dependencies:
      - target: Seddly
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pearsonmedia.SeddlyTests

  SeddlyUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: SeddlyUITests
        excludes:
          - "**/.gitkeep"
    dependencies:
      - target: Seddly
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pearsonmedia.SeddlyUITests
