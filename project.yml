name: Seddly
options:
  bundleIdPrefix: com.pearsonmedia
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.3"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
    SWIFT_EMIT_LOC_STRINGS: "YES"
    SWIFT_STRICT_CONCURRENCY: complete

targets:
  Seddly:
    type: application
    platform: iOS
    sources:
      - path: Seddly/Sources
        excludes:
          - "**/.gitkeep"
    resources:
      - path: Seddly/Resources
        excludes:
          - "**/.gitkeep"
    settings:
      base:
        INFOPLIST_FILE: Seddly/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Seddly/Resources/Seddly.entitlements
        INFOPLIST_KEY_CFBundleDisplayName: Seddly
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        PRODUCT_BUNDLE_IDENTIFIER: com.pearsonmedia.Seddly
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug:
          CODE_SIGN_STYLE: Automatic
        Release:
          CODE_SIGN_STYLE: Manual
    entitlements:
      path: Seddly/Resources/Seddly.entitlements
    dependencies:
      - target: SeddlyShareExtension
    scheme:
      testTargets:
        - SeddlyTests
        - SeddlyUITests
      gatherCoverageData: true

  SeddlyShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: SeddlyShareExtension
        excludes:
          - "**/.gitkeep"
      - path: Seddly/Sources/Shared
      - path: Seddly/Sources/Models
    settings:
      base:
        INFOPLIST_FILE: SeddlyShareExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: SeddlyShareExtension/SeddlyShareExtension.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.pearsonmedia.Seddly.ShareExtension
      configs:
        Debug:
          CODE_SIGN_STYLE: Automatic
        Release:
          CODE_SIGN_STYLE: Manual

  SeddlyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SeddlyTests
        excludes:
          - "**/.gitkeep"
    dependencies:
      - target: Seddly
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pearsonmedia.SeddlyTests

  SeddlyUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: SeddlyUITests
        excludes:
          - "**/.gitkeep"
    dependencies:
      - target: Seddly
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pearsonmedia.SeddlyUITests
