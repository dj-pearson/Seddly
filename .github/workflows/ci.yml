name: CI — Build & Test

on:
  push:
    # US-188: this was ['*']. A single asterisk in a branch filter does not
    # match a '/', so no push to a claude/* branch ever triggered CI — the run
    # history shows every feature-branch run arriving as a pull_request event.
    # '**' matches slashes, so feature branches now get build feedback on push
    # instead of only once a pull request is opened.
    branches: ['**']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # US-189: TruffleHog is a Docker action and GitHub's macOS runners ship no
  # Docker daemon, so running it inside the macOS build job failed with
  # "docker: command not found" (exit 127) on every single run — step 2 of 2
  # dozen, before Xcode selection, before xcodegen, before any compilation.
  # It now runs in its own Linux job, matching the layout android-ci.yml
  # already uses, so it scans and the build job actually gets to build.
  secrets-scan:
    name: Secrets Scanning
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for secrets
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified

  build-and-test:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode 16.3
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.3'

      - name: Show build environment
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen@2.42.0 || brew install xcodegen

      - name: Materialize xcconfigs
        # CI builds never hit the Supabase / AI code paths (they run simulator
        # Debug), so we stamp in placeholder values. AppConfiguration.swift
        # recognizes these as placeholders and returns nil to disable the
        # network-dependent flows.
        #
        # US-190: only Debug was materialized here, but project.yml declares
        # configFiles for BOTH Debug and Release, and XcodeGen validates every
        # referenced file at spec-load time regardless of which configuration is
        # being built. The missing Release.xcconfig aborted `xcodegen generate`
        # with "Spec validation error: Invalid config file". Real Release
        # secrets are still written only by release.yml, from GitHub secrets.
        run: |
          cp Seddly/Config/Debug.xcconfig.sample Seddly/Config/Debug.xcconfig
          cp Seddly/Config/Release.xcconfig.sample Seddly/Config/Release.xcconfig

      - name: Cache Xcode derived data
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: ${{ runner.os }}-xcode-${{ hashFiles('project.yml', '**/*.swift') }}
          restore-keys: |
            ${{ runner.os }}-xcode-

      - name: Generate Xcode project
        run: xcodegen generate

      # US-192: the build steps hardcoded 'name=iPhone 16' and 'name=Apple Watch
      # Series 10 (46mm)'. Runner images rotate which simulator runtimes are
      # preinstalled, and this one reported no iOS runtime at all ("iOS 18.4 is
      # not installed"), so xcodebuild exited 70 with "Unable to find a
      # destination matching the provided destination specifier". Discover a
      # real device at runtime instead of asserting one exists, and download the
      # platform if the image genuinely ships without it.
      - name: Resolve simulator destinations
        shell: bash
        run: |
          set -euo pipefail
          # Picks the newest available runtime matching $1 and prints one device UDID.
          PICK='import json,sys; d=json.load(sys.stdin)["devices"]; c=sorted((r,x["name"],x["udid"]) for r,e in d.items() if sys.argv[1] in r for x in e if x.get("isAvailable")); print(c[-1][2] if c else "")'

          resolve() { xcrun simctl list devices available -j | python3 -c "$PICK" "$1"; }

          IOS_SIM=$(resolve iOS)
          if [ -z "$IOS_SIM" ]; then
            echo "No iOS simulator runtime on this image — downloading the platform."
            xcodebuild -downloadPlatform iOS
            IOS_SIM=$(resolve iOS)
          fi
          [ -n "$IOS_SIM" ] || { echo "::error::No iOS simulator available after download"; exit 1; }

          WATCH_SIM=$(resolve watchOS)
          if [ -z "$WATCH_SIM" ]; then
            echo "No watchOS simulator runtime on this image — downloading the platform."
            xcodebuild -downloadPlatform watchOS
            WATCH_SIM=$(resolve watchOS)
          fi
          [ -n "$WATCH_SIM" ] || { echo "::error::No watchOS simulator available after download"; exit 1; }

          echo "Resolved iOS simulator:     $IOS_SIM"
          echo "Resolved watchOS simulator: $WATCH_SIM"
          echo "IOS_SIM=$IOS_SIM" >> "$GITHUB_ENV"
          echo "WATCH_SIM=$WATCH_SIM" >> "$GITHUB_ENV"

      - name: Build for testing
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project Seddly.xcodeproj \
            -scheme Seddly \
            -destination "id=$IOS_SIM" \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --quiet

      - name: Build Watch target
        run: |
          set -o pipefail
          xcodebuild build \
            -project Seddly.xcodeproj \
            -scheme SeddlyWatch \
            -destination "id=$WATCH_SIM" \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --quiet

      - name: SwiftLint
        # US-179: this passed an explicit `Seddly/Sources/` path, which overrides
        # the config's `included:` list and silently skipped the Share
        # Extension, Widget, Watch, complication, and test targets. Dropping the
        # path lets .swiftlint.yml decide the scope, so every target is linted.
        run: |
          brew install swiftlint
          swiftlint version
          swiftlint lint --strict --reporter github-actions-logging

      - name: Run unit tests with coverage
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project Seddly.xcodeproj \
            -scheme Seddly \
            -destination "id=$IOS_SIM" \
            -configuration Debug \
            -resultBundlePath TestResults.xcresult \
            -enableCodeCoverage YES \
            | xcbeautify --quiet

      - name: Check test coverage
        run: |
          COVERAGE=$(xcrun xccov view --report --json TestResults.xcresult \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print(f'{d[\"lineCoverage\"]*100:.1f}')")
          echo "Code coverage: ${COVERAGE}%"
          python3 -c "
          coverage = float('${COVERAGE}')
          if coverage < 60:
              print(f'::error::Code coverage {coverage}% is below the 60% minimum threshold')
              exit(1)
          else:
              print(f'Coverage {coverage}% meets the 60% minimum threshold')
          "

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults.xcresult
          retention-days: 14
