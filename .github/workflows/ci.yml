name: CI — Build & Test

on:
  push:
    branches: ['*']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16.3
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.3'

      - name: Show build environment
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen@2.42.0 || brew install xcodegen

      - name: Cache Xcode derived data
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: ${{ runner.os }}-xcode-${{ hashFiles('project.yml', '**/*.swift') }}
          restore-keys: |
            ${{ runner.os }}-xcode-

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for testing
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project Seddly.xcodeproj \
            -scheme Seddly \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --quiet

      - name: Build Watch target
        run: |
          set -o pipefail
          xcodebuild build \
            -project Seddly.xcodeproj \
            -scheme SeddlyWatch \
            -destination 'platform=watchOS Simulator,name=Apple Watch Series 10 (46mm),OS=latest' \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --quiet

      - name: SwiftLint
        run: |
          brew install swiftlint || true
          swiftlint lint --strict --reporter github-actions-logging Seddly/Sources/

      - name: Run unit tests with coverage
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project Seddly.xcodeproj \
            -scheme Seddly \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -configuration Debug \
            -resultBundlePath TestResults.xcresult \
            -enableCodeCoverage YES \
            | xcbeautify --quiet

      - name: Check test coverage
        run: |
          COVERAGE=$(xcrun xccov view --report --json TestResults.xcresult \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print(f'{d[\"lineCoverage\"]*100:.1f}')")
          echo "Code coverage: ${COVERAGE}%"
          python3 -c "
          coverage = float('${COVERAGE}')
          if coverage < 60:
              print(f'::error::Code coverage {coverage}% is below the 60% minimum threshold')
              exit(1)
          else:
              print(f'Coverage {coverage}% meets the 60% minimum threshold')
          "

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults.xcresult
          retention-days: 14
