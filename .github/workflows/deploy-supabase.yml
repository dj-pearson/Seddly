name: Deploy Supabase Edge Functions

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Deno lint
        run: deno lint --config supabase/functions/deno.json supabase/functions/

      # US-181: this was `deno check supabase/functions/**/index.ts`, which only
      # worked by accident — with globstar off bash degrades `**` to `*`, and
      # that happens to match the current flat one-directory-per-function
      # layout. It would silently stop covering anything nested. Enable globstar
      # for real recursion and assert the expansion covers every function
      # directory, so a partial or empty match fails loudly instead of passing.
      - name: Deno type check
        shell: bash
        run: |
          shopt -s globstar nullglob
          entrypoints=(supabase/functions/**/index.ts)
          expected=$(find supabase/functions -mindepth 2 -maxdepth 2 -name index.ts | wc -l)
          if [ "${#entrypoints[@]}" -ne "$expected" ] || [ "${#entrypoints[@]}" -eq 0 ]; then
            echo "::error::Expected $expected function entrypoints, matched ${#entrypoints[@]}"
            exit 1
          fi
          printf 'Type-checking %d functions:\n' "${#entrypoints[@]}"
          printf '  %s\n' "${entrypoints[@]}"
          deno check --config supabase/functions/deno.json "${entrypoints[@]}"

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy extract-commitments
        run: |
          supabase functions deploy extract-commitments \
            --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy generate-dispute-summary
        run: |
          supabase functions deploy generate-dispute-summary \
            --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy subscription-webhook
        run: |
          supabase functions deploy subscription-webhook \
            --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy send-silent-push
        run: |
          supabase functions deploy send-silent-push \
            --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy api-commitments
        run: |
          supabase functions deploy api-commitments \
            --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy delete-account
        run: |
          supabase functions deploy delete-account \
            --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
